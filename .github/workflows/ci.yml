name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.14"

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Use a PEP 621-capable pip
        run: python -m pip install --upgrade 'pip>=24,<27'

      - name: Install the package
        run: python -m pip install .

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Compile source modules
        run: python -m compileall -q -f src

      - name: Run the test suite
        run: python -m unittest discover -s tests -v

      - name: Run the end-to-end example
        run: python examples/basic.py

  spacy-adapter:
    name: Optional spaCy adapter (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.14"

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Use a PEP 621-capable pip
        run: python -m pip install --upgrade 'pip>=24,<27'

      - name: Install the package with spaCy support
        run: python -m pip install '.[spacy]'

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Run the sentence-segmentation tests
        run: python -m unittest discover -s tests -p 'test_sentence_segmentation.py' -v

  code-adapter:
    name: Optional code parser (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.14"

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Use a PEP 621-capable pip
        run: python -m pip install --upgrade 'pip>=24,<27'

      - name: Install the package with code parsing support
        run: python -m pip install '.[code]'

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Run the code and repository ingestion tests
        run: >-
          python -m unittest
          tests.test_code
          tests.test_repository
          -v

  wheel-smoke:
    name: Wheel install and metadata smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out the exact workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install modern packaging tools
        run: python -m pip install --upgrade 'pip>=24,<27' 'build>=1.2,<2'

      - name: Build the wheel outside the checkout
        working-directory: ${{ runner.temp }}
        run: >-
          python -m build
          --wheel
          --outdir "$RUNNER_TEMP/wheelhouse"
          "$GITHUB_WORKSPACE"

      - name: Install the built wheel
        shell: bash
        run: |
          shopt -s nullglob
          wheels=("$RUNNER_TEMP"/wheelhouse/*.whl)
          test "${#wheels[@]}" -eq 1
          python -m pip install --force-reinstall "${wheels[0]}"

      - name: Check installed dependency consistency
        run: python -m pip check

      - name: Verify installed metadata and public imports outside the checkout
        working-directory: ${{ runner.temp }}
        run: |
          python - <<'PY'
          from importlib.metadata import distribution
          import os
          from pathlib import Path

          import modular_rag
          import rag_ingestion
          from modular_rag import RAGApplication, build_demo_rag

          installed = distribution("modular-rag")
          assert installed.metadata["Name"] == "modular-rag"
          assert installed.version == "0.1.0"
          checkout = Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          for module in (modular_rag, rag_ingestion):
              module_path = Path(module.__file__).resolve()
              assert checkout not in module_path.parents, module_path
          assert isinstance(build_demo_rag(), RAGApplication)
          PY
