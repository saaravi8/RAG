[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-rag"
version = "0.1.0"
description = "A dependency-light, replaceable skeleton for retrieval-augmented generation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pathspec>=1.1.1,<2",
    "pypdf>=7.1.1",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=6.3.0",
]
reranking = [
    "sentence-transformers>=6.3.0",
]
code = [
    "tree-sitter-language-pack>=1.23.1,<2; python_version >= '3.10'",
    "tree-sitter-languages==1.10.2; python_version == '3.9'",
    "tree-sitter==0.26.1; python_version == '3.9'",
]
spacy = [
    "spacy>=3.8.18,<3.9; python_version == '3.9'",
    "spacy>=3.8.18,<4; python_version >= '3.10'",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
