[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modular-rag"
version = "0.1.0"
description = "A dependency-light, replaceable skeleton for retrieval-augmented generation"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "pathspec>=0.12.1,<2",
    "pypdf>=5.1",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3",
]
reranking = [
    "sentence-transformers>=3",
]
code = [
    "tree-sitter-language-pack>=1.12.3,<2; python_version >= '3.10'",
    "tree-sitter-languages==1.10.2; python_version == '3.9'",
    "tree-sitter==0.26.0; python_version == '3.9'",
]
spacy = [
    "spacy>=3.7.5,<3.8; python_version == '3.9'",
    "spacy>=3.8.8,<4; python_version >= '3.10'",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
